name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  # GITHUB_TOKEN commits from Update Gold Price do not trigger push workflows,
  # so also deploy after a successful gold update.
  workflow_run:
    workflows: ["Update Gold Price"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, check out the commit from the completed update workflow
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
